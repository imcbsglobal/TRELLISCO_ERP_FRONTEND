# Trellisco ERP — same-origin proxy for the imcbs APIs a browser cannot call.
#
# activate.imcbs.com and centralmastermanagement.imcbs.com answer without a
# single Access-Control-* header, and the T-ERP license POST is refused at its
# preflight with a 405, so an SPA served from https://trelliscoerp.com is
# blocked before it can read any of those replies. The SPA therefore asks its
# own origin (/terp-api/..., /central-api/...) and nginx forwards the request:
#
#   /terp-api/t-erp/mobileapp/api/projects/  -> activate.imcbs.com/t-erp/mobileapp/api/projects/
#   /terp-api/client-id-list/get-client-ids/ -> activate.imcbs.com/client-id-list/get-client-ids/
#   /central-api/api/user-master/            -> centralmastermanagement.imcbs.com/api/user-master/
#   /central-api/api/financial-year/...      -> centralmastermanagement.imcbs.com/api/financial-year/...
#
# Install: paste the two blocks below into the `server { }` block that serves
# trelliscoerp.com (they are prefix locations, so they win over the SPA's
# try_files fallback), then:
#
#   sudo nginx -t && sudo systemctl reload nginx
#
# Both upstreams sit behind Cloudflare, so the address is resolved once when
# nginx starts: reload nginx if one of them moves, or uncomment the resolver
# lines to resolve per request.

location /terp-api/ {
    # The trailing slash makes nginx replace the /terp-api/ prefix itself — the
    # same rewrite the Vite dev proxy applies in vite.config.js.
    proxy_pass             https://activate.imcbs.com/;
    proxy_http_version     1.1;
    proxy_ssl_server_name  on;
    proxy_set_header       Host              activate.imcbs.com;
    proxy_set_header       X-Real-IP         $remote_addr;
    proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header       X-Forwarded-Proto $scheme;
    # resolver 1.1.1.1 ipv6=off valid=300s;
    proxy_connect_timeout  15s;
    proxy_read_timeout     60s;
}

location /central-api/ {
    proxy_pass             https://centralmastermanagement.imcbs.com/;
    proxy_http_version     1.1;
    proxy_ssl_server_name  on;
    proxy_set_header       Host              centralmastermanagement.imcbs.com;
    proxy_set_header       X-Real-IP         $remote_addr;
    proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header       X-Forwarded-Proto $scheme;
    # resolver 1.1.1.1 ipv6=off valid=300s;
    proxy_connect_timeout  15s;
    proxy_read_timeout     60s;
}
